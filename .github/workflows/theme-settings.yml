name: Appearance settings regression
on:
  pull_request:
    paths:
      - 'src/data/themeSettings.js'
      - 'src/components/AppearanceSettingsBox.js'
      - 'src/useUnsavedChangesGuard.js'
      - 'src/app.js'
      - 'scripts/theme-settings.test.mjs'
      - '.github/workflows/theme-settings.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run test:theme-settings
      - run: npm run lint
      - run: npm run build
