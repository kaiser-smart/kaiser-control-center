name: Forpsi connector and SO.ai administration
on:
  pull_request:
    paths:
      - 'services/forpsi-connector/**'
      - 'functions/api/forpsi/**'
      - 'functions/authorize.js'
      - 'functions/mcp.js'
      - 'functions/oauth/**'
      - 'functions/.well-known/oauth-*.js'
      - 'functions/.well-known/oauth-protected-resource/**'
      - 'functions/_lib/forpsi-oauth-proxy.js'
      - 'functions/_lib/auth.js'
      - 'functions/_lib/users-store.js'
      - 'src/components/ForpsiAdminPanel.js'
      - 'src/components/ForpsiMailPanel.js'
      - 'src/components/ForpsiWorkPanel.js'
      - 'src/components/ForpsiComposer.js'
      - 'src/app.js'
      - 'scripts/forpsi-admin.test.mjs'
      - 'scripts/forpsi-mail.test.mjs'
      - 'scripts/forpsi-setup.test.mjs'
      - 'scripts/forpsi-oauth-pages.test.mjs'
      - 'scripts/forpsi-send.test.mjs'
      - 'scripts/forpsi-personal-settings.test.mjs'
      - 'scripts/forpsi-analysis-proxy.test.mjs'
      - 'scripts/forpsi-analysis-eval-auth.test.mjs'
      - 'public/forpsi-setup/**'
      - 'public/forpsi-access/**'
      - 'public/forpsi-send/**'
      - 'public/forpsi-mail-settings/**'
      - '.github/workflows/forpsi-connector.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm --dir services/forpsi-connector install --frozen-lockfile --ignore-scripts
      - run: node --test scripts/forpsi-*.test.mjs services/forpsi-connector/test/*.test.mjs
      - run: node scripts/check-syntax.mjs
      - run: node scripts/build.mjs
      - run: pnpm --dir services/forpsi-connector build
        env:
          WRANGLER_SEND_METRICS: 'false'
