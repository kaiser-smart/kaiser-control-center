name: One-time approved fuel detail write
on:
  push:
    branches: [codex/cloud-fuel-recovery-20261022]
    paths: [.github/workflows/one-time-fuel-detail-write.yml]
permissions: {}
concurrency:
  group: one-time-fuel-detail-write
  cancel-in-progress: false
jobs:
  approved-write:
    if: github.repository == 'kaiser-smart/kaiser-control-center' && github.actor == 'oplustil-prog'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify the exact approved source and one-time trigger
        run: |
          test "$(git rev-parse HEAD^)" = d1b5f8632d08c6f76245ded02d52e64a2bbe4617
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = .github/workflows/one-time-fuel-detail-write.yml
          test "$(git ls-remote origin refs/heads/codex/cloud-fuel-recovery-20261022 | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply only the two reviewed app edits
        run: |
          node scripts/prepare-fuel-detail-patch.mjs --apply
          node scripts/prepare-fuel-detail-patch.mjs --apply
          node scripts/fleet-fuel-identity-view.test.mjs
          node --check src/app.js
          git diff --check
          test "$(git diff --name-only)" = src/app.js
          git diff -- src/app.js
      - name: Commit only app.js to the existing feature branch
        run: |
          test "$(git ls-remote origin refs/heads/codex/cloud-fuel-recovery-20261022 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/app.js
          test "$(git diff --cached --name-only)" = src/app.js
          git commit -m 'fix(fleet): wire fuel detail to explicit vehicle identities'
          git push origin HEAD:refs/heads/codex/cloud-fuel-recovery-20261022
