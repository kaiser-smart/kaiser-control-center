name: Fleet fuel cloud checks
on:
  pull_request:
    paths:
      - "functions/_lib/orwii-fuel-store.js"
      - "functions/_lib/fleet-vehicle-aliases.js"
      - "scripts/*fuel*.test.mjs"
      - ".github/workflows/fleet-fuel-cloud.yml"
  push:
    branches: ["codex/cloud-fuel-recovery-20261022"]
permissions:
  contents: read
jobs:
  fuel-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check patch whitespace
        run: git diff --check origin/main...HEAD
      - name: Check JavaScript syntax
        run: npm run lint
      - name: Isolated fuel regression tests
        run: npm run test:orwii-fuel
      - name: Build application
        run: npm run build
      - name: Bundle ORWII Worker in cloud
        run: |
          npx --yes esbuild@0.25.12 workers/orwii-fuel-sync-runner.js --bundle --format=esm --platform=browser --target=es2022 --minify --outfile=/tmp/orwii-fuel-cloud.mjs
          node --check /tmp/orwii-fuel-cloud.mjs
          sha256sum /tmp/orwii-fuel-cloud.mjs
          printf 'ORWII worker built and checked exclusively in GitHub Actions. Source: %s\n\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf '```text\n' >> "$GITHUB_STEP_SUMMARY"
          base64 -w0 /tmp/orwii-fuel-cloud.mjs >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
