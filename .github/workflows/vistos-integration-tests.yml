name: Vistos integration safety

on:
  pull_request:
    paths:
      - "functions/_lib/vistos-*.js"
      - "functions/_lib/receivables-*.js"
      - "workers/receivables-invoice-sync-runner.js"
      - "wrangler.receivables-invoice-sync-runner.toml"
      - "scripts/receivables-*.mjs"
      - "src/data/receivablesInvoicePagination.js"
      - "functions/api/receivables/vistos/**"
      - "workers/vistos-leadhub-*.js"
      - "scripts/vistos-*.mjs"
      - "package.json"
      - "functions/api/jobs/**"
      - "functions/api/integrations/**"
      - "src/components/VistosWorkspace.js"
      - "src/components/VistosJobDetail.js"
      - "src/vistos-workspace.css"
      - "migrations/modular/**"
      - "wrangler.vistos-leadhub-profile-sync-runner.toml"
      - ".github/workflows/vistos-integration-tests.yml"

permissions:
  contents: read

concurrency:
  group: vistos-safety-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: npm run lint
      - name: Contact selection, shared writer and CSV safety
        run: npm run test:vistos-contacts
      - name: Invoice synchronization recovery and customer pagination
        run: npm run test:receivables
      - name: Jobs, payments and tracking evidence
        run: npm run test:vistos-jobs-payments
      - name: Bounded monitor route batches
        run: node scripts/self-repair-monitor.test.mjs
      - name: Build
        run: npm run build
