name = "kaiser-ccs-sync-runner"
main = "workers/ccs-sync-runner.js"
compatibility_date = "2026-10-27"
workers_dev = false

[[d1_databases]]
binding = "DB_CORE"
database_name = "SMART_ODPADY_CORE"
database_id = "7babb37a-dc19-4bbc-b4f8-3346f4e1aa23"

[[d1_databases]]
binding = "DB_ARCHIVE"
database_name = "SMART_ODPADY_ARCHIVE"
database_id = "b10566be-ebb1-414c-beab-eac03f1a909b"

[[r2_buckets]]
binding = "R2_ARCHIVE"
bucket_name = "smart-odpady-archive"

[triggers]
crons = ["7 */4 * * *", "*/15 * * * *"]

[observability]
enabled = true
