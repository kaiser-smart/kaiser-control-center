<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Smart odpady - provozní systém pro odpady, vozidla a trasy."
    />
    <title>Smart odpady</title>
    <meta name="application-name" content="SMART ODPADY" />
    <meta name="theme-color" content="#75bd25" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SMART ODPADY" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      const pathParts = location.pathname.split("/").filter(Boolean);
      const basePath = location.hostname.endsWith("github.io") && pathParts.length > 0
        ? `/${pathParts[0]}/`
        : "/";
      document.write(`<base href="${basePath}">`);
    </script>
    <link rel="icon" href="favicon.ico?v=kaiser-original-2" sizes="16x16 32x32 48x48 64x64" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=kaiser-original-2" sizes="any" />
    <link rel="manifest" href="manifest.webmanifest?v=kaiser-original-2" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=kaiser-original-2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/styles.css" />
    <link rel="stylesheet" href="src/ui-system-pilot.css" />
    <link rel="stylesheet" href="src/mobile-workspace.css" />
    <link rel="stylesheet" href="src/icon-system.css" />
    <link rel="stylesheet" href="src/vistos-workspace.css" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      function showStartupError() {
        const app = document.querySelector("#app");
        if (!app || app.children.length) {
          return;
        }

        app.innerHTML = `
          <main class="login-shell">
            <section class="login-panel" aria-label="Chyba načtení">
              <a class="kaiser-logo" href="/" aria-label="Smart odpady">
                <img class="kaiser-logo__image" src="logo-kaiser.png" alt="Kaiser" width="501" height="320" />
              </a>
              <h1>Smart odpady</h1>
              <p class="login-subtitle">Aplikace se nepodařila načíst.</p>
              <button class="primary-action" type="button" onclick="window.location.reload()">
                Obnovit stránku
              </button>
            </section>
          </main>
        `;
      }

      window.addEventListener("error", (event) => {
        if (event.target && ["SCRIPT", "LINK"].includes(event.target.tagName)) {
          showStartupError();
        }
      }, true);
      window.addEventListener("unhandledrejection", showStartupError);
    </script>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
