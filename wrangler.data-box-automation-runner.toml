name = "kaiser-data-box-automation-runner"
main = "workers/data-box-automation-runner.js"
compatibility_date = "2026-06-29"
workers_dev = false

[vars]
DATA_BOX_AUTOMATION_MODE = "live"

[[d1_databases]]
binding = "DB_CORE"
database_name = "SMART_ODPADY_CORE"
database_id = "7babb37a-dc19-4bbc-b4f8-3346f4e1aa23"

[[d1_databases]]
binding = "DB_AUDIT"
database_name = "SMART_ODPADY_AUDIT"
database_id = "5abc8fa4-c155-4bf0-9c46-2db73d6d98e0"

[triggers]
crons = ["*/30 * * * *"]
