name = "kaiser-vistos-leadhub-profile-sync-runner"
main = "workers/vistos-leadhub-profile-sync-entry.js"
compatibility_date = "2026-09-10"
workers_dev = true

[vars]
APP_BASE_URL = "https://smart-odpady.ai"
# Short shared-writer steps continued by one durable workspace alarm.
RUN_MODE = "execute-import"
BUSINESS_READ_ENABLED = "true"
# Whole approved historical remainder. Arming and observed UI receipt remain
# separate explicit controls; this configuration cannot upload or subscribe.
CSV_BATCH_ID = "csv-20260918-whole"
CSV_SCOPE = "remaining"
# The standard LeadHub UI confirmed one successful submission of the exact
# whole batch (9,374 rows). These values only unlock per-profile readback and
# adoption by the existing coordinator; they never resubmit the CSV.
CSV_SUBMITTED_BATCH_ID = "csv-20260918-whole"
CSV_IMPORT_RECEIPT = "LEADHUB_UI_CONFIRMED_9374_IMPORTED_20260920"
# Observed interrupted READ, 2026-09-19: only this exact owner may enter the
# existing >10-minute, empty-journal, CAS-guarded recovery. No TTL takeover.
RECOVERY_OWNER = "9d91c9f4-fa3e-4844-af1a-6752aef37bf7"

[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "CONTINUATION"
class_name = "VistosLeadHubContinuation"

[[migrations]]
tag = "vistos-leadhub-continuation-v1"
new_sqlite_classes = ["VistosLeadHubContinuation"]
