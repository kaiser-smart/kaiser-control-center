name = "kaiser-module-automation-runner"
main = "workers/module-automation-runner.js"
compatibility_date = "2026-06-26"
workers_dev = false

[vars]
MODULE_AUTOMATION_MODULE_KEY = "absence"
MODULE_AUTOMATION_TIME_ZONE = "Europe/Prague"
MODULE_AUTOMATION_MODE = "dry-run"
APP_BASE_URL = "https://smart-odpady.ai"
D1_CAPACITY_BLOCK_BULK_WRITES = "true"

[[d1_databases]]
binding = "DB_CORE"
database_name = "SMART_ODPADY_CORE"
database_id = "7babb37a-dc19-4bbc-b4f8-3346f4e1aa23"

[[d1_databases]]
binding = "DB_MESSAGES"
database_name = "SMART_ODPADY_MESSAGES"
database_id = "8aeb65e8-9f53-4c93-869e-1f58484b1319"

[[d1_databases]]
binding = "DB_AUDIT"
database_name = "SMART_ODPADY_AUDIT"
database_id = "5abc8fa4-c155-4bf0-9c46-2db73d6d98e0"

[[d1_databases]]
binding = "DB_ARCHIVE"
database_name = "SMART_ODPADY_ARCHIVE"
database_id = "b10566be-ebb1-414c-beab-eac03f1a909b"

[[r2_buckets]]
binding = "R2_ARCHIVE"
bucket_name = "smart-odpady-archive"

[triggers]
crons = ["*/5 * * * *", "*/15 * * * *", "15 3 * * *", "7 * * * *"]
